<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise 36#</title>
</head>
<style>
    #colorPreview {
        width: 200px;
        height: 200px;
        border: 1px solid black ;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px 0;
    }
    #clearHistory{
        list-style: none;
        padding: 0;
    }
    #clearHistory li{
        margin: 5px 0;
    }


</style>
<body>
    <h1>interactive colorpicker</h1>
    <label for="colorpicker">choose color</label>
    <input type="color" id="colorpicker">
    <div id="colorPreview">color preview</div>

    <h2>color history</h2>
    <ul id="colorHistory"></ul>
   <button id="clearHistory">Clear</button>
    
    <script src="script.js"></script>
</body>
</html>
